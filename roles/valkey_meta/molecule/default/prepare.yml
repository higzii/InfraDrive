---
- name: Prepare isolated Debian 13 platform for valkey_meta
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: docker

  tasks:
    - name: Install python3-docker for community.docker modules
      ansible.builtin.apt:
        name:
          - python3-docker
          - python3-requests
        state: present
        update_cache: true

    - name: Remove any leftover Valkey container from persistent Docker volume
      community.docker.docker_container:
        name: "infradrive-valkey"
        state: absent
        force_kill: true

    - name: Ensure clean host directory state for Valkey configuration
      ansible.builtin.file:
        path: "/etc/infradrive"
        state: absent

    - name: Create shared InfraDrive Docker network
      community.docker.docker_network:
        name: "infradrive_net"
        driver: "bridge"
        state: present
