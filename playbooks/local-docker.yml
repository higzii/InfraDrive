---
- name: Deploy InfraDrive on local Docker Engine
  hosts: localhost
  connection: local
  gather_facts: true

  vars_files:
    - ../inventory/group_vars/all.yml

  vars:
    valkey_config_host_dir: "{{ playbook_dir }}/../.local/valkey"
    fastapi_publish_port: true
    fastapi_bind_address: "127.0.0.1"
    fastapi_host_port: 8000
    fastapi_healthcheck_enabled: true

  tasks:
    - name: Ensure InfraDrive Docker network exists
      community.docker.docker_network:
        name: "{{ infradrive_network_name }}"
        driver: "{{ infradrive_network_driver }}"
        state: present

    - name: Deploy Valkey
      ansible.builtin.include_role:
        name: valkey_meta

    - name: Deploy storage nodes
      ansible.builtin.include_role:
        name: storage

    - name: Deploy FastAPI backend
      ansible.builtin.include_role:
        name: fastapi
