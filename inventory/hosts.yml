---
all:
  children:
    infradrive:
      hosts:
        infradrive-debian13:
          ansible_host: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_TARGET_HOST') | default('127.0.0.1', true) }}"
          ansible_port: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_TARGET_PORT') | default(22, true) | int }}"
          ansible_user: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_TARGET_USER') | default('debian', true) }}"
          ansible_connection: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_ANSIBLE_CONNECTION') | default('ssh', true) }}"
