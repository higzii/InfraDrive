---
infradrive_network_name: "infradrive_net"
infradrive_network_driver: "bridge"

valkey_container_name: "infradrive-valkey"
valkey_image: "valkey/valkey"
valkey_image_tag: "8.0-alpine"
valkey_volume_name: "infradrive_valkey_data"
valkey_port: 6379
valkey_publish_ports: false
valkey_password: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_VALKEY_PASSWORD') | default('', true) }}"

storage_mode: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_STORAGE_MODE') | default('service', true) }}"
storage_image: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_STORAGE_IMAGE') | default('', true) }}"
storage_image_tag: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_STORAGE_TAG') | default('latest', true) }}"

storage_nodes:
  - name: "storage-1"
    volume: "infradrive_storage_1_data"
  - name: "storage-2"
    volume: "infradrive_storage_2_data"
  - name: "storage-3"
    volume: "infradrive_storage_3_data"

storage_mount_path: "/data"

fastapi_container_name: "infradrive-backend"
fastapi_image: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_FASTAPI_IMAGE') | default('', true) }}"
fastapi_image_tag: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_FASTAPI_TAG') | default('latest', true) }}"
fastapi_internal_port: 8000
fastapi_publish_port: false
fastapi_bind_address: "127.0.0.1"
fastapi_host_port: 8000
fastapi_healthcheck_enabled: true

# InfraDrive Storage Daemon
storage_env:
  STORAGE_DATA_DIR: "{{ storage_mount_path | default('/data') }}"
  STORAGE_PORT: "8001"
  STORAGE_MAX_CHUNK_BYTES: "4194304"

# InfraDrive Backend
fastapi_env:
  INFRADRIVE_VALKEY_HOST: "{{ valkey_container_name | default('infradrive-valkey') }}"
  INFRADRIVE_VALKEY_PORT: "{{ valkey_port | default(6379) | string }}"
  INFRADRIVE_VALKEY_PASSWORD: "{{ valkey_password | default('') }}"
  INFRADRIVE_STORAGE_NODES: "storage-1=http://storage-1:8001,storage-2=http://storage-2:8001,storage-3=http://storage-3:8001"
  INFRADRIVE_CHUNK_SIZE_BYTES: "4194304"
  INFRADRIVE_MAX_FILE_BYTES: "10737418240"
  INFRADRIVE_REPLICATION_FACTOR: "2"
  INFRADRIVE_STORAGE_TIMEOUT_SECONDS: "10"
  INFRADRIVE_STORAGE_CONNECT_TIMEOUT_SECONDS: "3"
  INFRADRIVE_API_TOKEN: "{{ lookup('ansible.builtin.env', 'INFRADRIVE_API_TOKEN') | default('', true) }}"

# Backend healthcheck
fastapi_healthcheck_test:
  - CMD
  - python
  - -c
  - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
